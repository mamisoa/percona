[project]
name = "percona"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.4",
    "pymysql>=1.1.1",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",
    "rich>=13.9.4",
    "uvicorn>=0.32.0",
]

[project.scripts]
percona-cluster-check = "percona.cli:main"

[tool.uv]
# Mark project as packageable so entry points (project.scripts) are installed.
package = true
